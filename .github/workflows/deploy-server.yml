name: Deploy server

on:
  push:
    branches: [main, master]
    paths:
      - "apps/server/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build check
        run: |
          npm ci
          npm run build:shared
          npm run build -w @monibuddy/server

      - name: Deploy via Render hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret이 없습니다. Render Dashboard → Service → Deploy Hook URL을 GitHub Secrets에 추가하세요."
            echo "CI 빌드는 통과했으므로, 시크릿 설정 후 다시 배포하면 됩니다."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo "Render deploy triggered."
