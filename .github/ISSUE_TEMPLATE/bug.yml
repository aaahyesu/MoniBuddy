name: 버그 제보
description: 문제가 발생했을 때 제보합니다
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 무엇을 하다가 어떤 문제가 생겼나요?
      placeholder: 예) 캐릭터를 클릭해도 채팅창이 열리지 않아요
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: 환경
      placeholder: Windows 버전 / 앱 버전 / 서버 URL
    validations:
      required: false
