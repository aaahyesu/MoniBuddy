[package]
name = "monibuddy"
version = "0.1.1"
description = "MoniBuddy — monitor-edge character buddies with invite chat"
authors = ["MoniBuddy"]
edition = "2021"

[lib]
name = "monibuddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
